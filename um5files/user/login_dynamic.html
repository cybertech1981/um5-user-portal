<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f5fbf">
    <title>User Manager</title>
    <link rel="preload" href="../fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" type="text/css" href="../css/user.css?v=1.1.2">
    <link rel="stylesheet" type="text/css" href="../css/login.css?v=1.1.2">
    <script src="../js/generic.js?v=1.1.2"></script>
    <script>applyLang();</script>
    <script src="../js/login.js?v=1.1.2"></script>
</head>
<body class="login-page">
    <div class="login-tools">
        <div class="lang-switch" id="lang-switch"></div>
        <button class="icon-btn" type="button" onclick="toggleTheme()" data-i18n-title="theme.toggle" data-icon="moon"></button>
    </div>

    <main class="login-wrap">
        <div class="login-art" aria-hidden="true">
            <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
            <span class="login-mark" data-icon="wifi"></span>
        </div>

        <div class="card login-card" id="login-container">
            <div class="login-head">
                <span class="brand-mark" data-icon="wifi"></span>
                <div>
                    <div class="login-brand" data-brand></div>
                    <h1 data-i18n="login.title"></h1>
                </div>
            </div>
            <p class="login-sub" data-i18n="login.subtitle"></p>

            <form id="login-form" onsubmit="loginSubmited(); return false;" novalidate>
                <label class="field">
                    <span class="field-label" data-i18n="login.username"></span>
                    <span class="field-box">
                        <span data-icon="user"></span>
                        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required>
                    </span>
                </label>
                <label class="field">
                    <span class="field-label" data-i18n="login.password"></span>
                    <span class="field-box">
                        <span data-icon="lock"></span>
                        <input type="password" id="password" name="password" autocomplete="current-password" dir="ltr" required>
                        <button type="button" class="eye" id="eye" onclick="togglePass()" data-i18n-title="login.show" data-icon="eye"></button>
                    </span>
                </label>

                <div id="error-text" class="login-error" role="alert"></div>
                <button type="submit" class="btn block loginbtn" id="login-btn"><span data-i18n="login.submit"></span></button>
            </form>
        </div>
    </main>
    <footer class="site-foot"><span dir="ltr">© 2026 <a href="https://amirechotech.ca/" target="_blank" rel="noopener noreferrer">Amir Echo Tech</a></span></footer>
</body>
</html>
