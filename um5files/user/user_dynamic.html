<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f5fbf">
    <title>User Manager</title>
    <link rel="preload" href="../fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" type="text/css" href="../css/user.css?v=1.1.2">
    <script src="../js/generic.js?v=1.1.2"></script>
    <script>applyLang();</script>
    <script src="../js/user.js?v=1.1.2"></script>
</head>
<body>
<div class="loadbar" id="loadbar"></div>
<div class="app">
    <header class="topbar">
        <div class="topbar-in">
            <a class="brand" href="#status">
                <span class="brand-mark" data-icon="wifi"></span>
                <span class="brand-name" data-brand></span>
            </a>
            <nav class="nav" id="nav">
                <a href="#status" data-view="status"><span data-icon="grid"></span><span data-i18n="nav.status"></span></a>
                <a href="#profiles" data-view="profiles"><span data-icon="box"></span><span data-i18n="nav.profiles"></span></a>
                <a href="#sessions" data-view="sessions"><span data-icon="list"></span><span data-i18n="nav.sessions"></span></a>
                <a href="#payments" data-view="payments"><span data-icon="card"></span><span data-i18n="nav.payments"></span></a>
                <a href="#about" data-view="about"><span data-icon="info"></span><span data-i18n="about.nav"></span></a>
            </nav>
            <div class="top-tools">
                <div class="lang-switch" id="lang-switch"></div>
                <button class="icon-btn" type="button" onclick="toggleTheme()" data-i18n-title="theme.toggle" data-icon="moon"></button>
                <button class="icon-btn" type="button" onclick="onLogout()" data-i18n-title="nav.logout"><span class="ltr-flip" data-icon="logout"></span></button>
            </div>
        </div>
    </header>

    <main class="main" id="container">

        <!-- DASHBOARD -->
        <section class="view" id="status">
            <div class="card hero" id="hero">
                <div class="hero-top">
                    <div>
                        <p class="hello" data-i18n="status.hello"></p>
                        <p class="uname" id="h-user"><span class="skeleton" style="display:inline-block;width:140px;height:26px"></span></p>
                    </div>
                    <div class="plan" id="h-plan"></div>
                </div>
            </div>

            <div class="stats">
                <div class="card stat"><span class="stat-ic c1" data-icon="down"></span><div><div class="stat-label" data-i18n="status.download"></div><div class="stat-value" id="s-down">—</div></div></div>
                <div class="card stat"><span class="stat-ic c2" data-icon="up"></span><div><div class="stat-label" data-i18n="status.upload"></div><div class="stat-value" id="s-up">—</div></div></div>
                <div class="card stat"><span class="stat-ic c3" data-icon="clock"></span><div><div class="stat-label" data-i18n="status.uptime"></div><div class="stat-value" id="s-time">—</div></div></div>
                <div class="card stat"><span class="stat-ic c4" data-icon="link"></span><div><div class="stat-label" data-i18n="status.sessions"></div><div class="stat-value" id="s-sess">—</div><div class="stat-sub" id="s-sess-max"></div></div></div>
            </div>

            <h2 class="section" data-i18n="status.myPlans"></h2>
            <div class="plans" id="status-profiles"></div>

            <h2 class="section" data-i18n="status.expiredPlans"></h2>
            <div class="plans" id="status-exp-profiles"></div>
        </section>

        <!-- SESSIONS -->
        <section class="view" id="sessions">
            <div class="page-head"><h1 data-i18n="sessions.title"></h1></div>
            <div class="card table-wrap" id="sessions-sessions"></div>
        </section>

        <!-- PAYMENTS -->
        <section class="view" id="payments">
            <div class="page-head"><h1 data-i18n="payments.title"></h1></div>
            <div class="card table-wrap" id="payments-payments"></div>
        </section>

        <!-- PLAN CATALOGUE -->
        <section class="view" id="profiles">
            <div class="page-head"><h1 data-i18n="profiles.title"></h1></div>
            <div class="catalog" id="profiles-profiles"></div>
        </section>

        <!-- PLAN DETAIL -->
        <section class="view" id="profile">
            <div class="page-head">
                <a class="btn ghost sm" href="#profiles"><span class="ltr-flip" data-icon="chevron"></span><span data-i18n="btn.back"></span></a>
                <h1 data-i18n="profile.title"></h1>
            </div>
            <div class="card detail" id="profile-data"></div>
        </section>

        <!-- BUY -->
        <section class="view" id="buyprofile">
            <div class="page-head"><h1 data-i18n="buy.title"></h1></div>
            <div class="card detail" id="buyprofile-buyprofile"></div>
        </section>

        <!-- ABOUT -->
        <section class="view" id="about">
            <div class="page-head"><h1 data-i18n="about.title"></h1></div>
            <div class="card" style="padding:22px" id="about-data"></div>
        </section>

        <!-- REDIRECTING -->
        <section class="view" id="redirecting">
            <div class="card redirect"><div class="spinner"></div><div data-i18n="redirect.text"></div></div>
        </section>
    </main>
    <footer class="site-foot"><span dir="ltr">© 2026 <a href="https://amirechotech.ca/" target="_blank" rel="noopener noreferrer">Amir Echo Tech</a></span></footer>
</div>
</body>
</html>
